[project]
name = "plpd"
version = "0.1.0"
description = "Premier League match, table and player predictions."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
plpd-snapshot = "plpd.pipelines.snapshot:main"
plpd-load = "plpd.pipelines.load:main"
plpd-backtest = "plpd.pipelines.backtest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
